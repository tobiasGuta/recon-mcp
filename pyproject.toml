[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-mcp"
version = "0.2.0"
description = "A safe local MCP server for human-led bug bounty recon helpers."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "defusedxml>=0.7.1",
    "certifi>=2024.7.4",
    "httpcore>=1.0.9,<1.1",
    "httpx>=0.29.0,<0.30",
    "idna>=3.6,<4",
    "mcp>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["recon*"]
